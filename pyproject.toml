#:schema https://json.schemastore.org/pyproject.json

[project]
authors = [
  { name = "ONEKEY", email = "support@onekey.com" },
  { name = "Stanisław Pitucha", email = "viraptor@gmail.com" },
]

dependencies = []
description = "Library for accessing 'ar' files"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
name = "arpy"
readme = "README.md"
requires-python = ">=3.10"
version = "2.4.0"

[dependency-groups]
check = ["pre-commit>=3.5,<5.0", "ruff==0.16.10", "taplo>=0.9.3"]
dev = [
  { include-group = "check" },
  { include-group = "test" },
  { include-group = "type" },
]
test = ["pytest-cov>=7,<8", "pytest>=9.0.3"]
type = ["pyright>=1.1.349"]

[tool.uv.build-backend]
module-root = ""

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.17,<0.13"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
  "A",      # flake8-builtins
  "ARG",    # flake8-unused-arguments
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "C90",    # mccabe
  "COM818", # flake8-commas; trailing-comma-on-bare-tuple
  "D",      # pydocstyle
  "E",      # pycodestyle (errors)
  "F",      # pyflakes
  "FBT",    # flake8-boolean-trap
  "G",      # flake8-logging-format
  "I",      # isort
  "N",      # pep8-naming
  "PIE",    # flake8-pie
  "PL",     # pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF",    # ruff's own lints
  "S",      # flake8-bandit
  "SIM",    # flake8-simplify
  "SLF",    # flake8-self
  "T10",    # flake8-debugger
  "T20",    # flake8-print
  "TC",     # flake8-type-checking
  "TRY",    # tryceratops
  "UP",     # pyupgrade
  "W",      # pycodestyle (warnings)
]

ignore = [
  "D1",     # undocumented-*:                    We are not documenting every public symbol
  "D203",   # one-blank-line-before-class:       D211 (no-blank-line-before-class) is used instead
  "D213",   # multi-line-summary-second-line:    D212 (multi-line-summary-first-line) is used instead
  "E501",   # line-too-long:                     Let ruff format handle line length violations
  "PLR09",  # too-many-{arguments,branches,...}: We do not want to impose hard limits
  "S101",   # assert:                            Enable usage of asserts
  "TRY003", # raise-vanilla-args:                We are adding contextual information in exception messages
]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true # code like `dict(a=1, b=2)` is allowed

[tool.ruff.lint.isort]
known-first-party = ["arpy"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
allow-magic-value-types = [
  "bytes",
  "int",   # bunch of ad-hoc bitmask values
  "str",
]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.pytest.ini_options]
addopts = "--cov"
norecursedirs = """
  *.egg
  *_extract
  .*
  dist
  build
  target
"""

[tool.coverage.run]
branch = true
source = ["arpy", "tests"]

[tool.coverage.report]
fail_under = 90
skip_covered = true

[tool.vulture]
exclude = []
paths = ["arpy/", "vulture_whitelist.py"]

[tool.pyright]
exclude = [".venv", "build", "vulture_whitelist.py"]
